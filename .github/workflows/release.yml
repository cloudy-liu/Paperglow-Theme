name: Release

on:
  push:
    tags:
      - "paperglow-v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      - name: Build release packages
        id: build
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "${TAG_NAME}" in
            paperglow-v*) version="${TAG_NAME#paperglow-v}" ;;
            *) version="${TAG_NAME}" ;;
          esac

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must resolve to a semantic version, got: ${TAG_NAME}" >&2
            exit 1
          fi

          mkdir -p dist/typora dist/obsidian

          cp typora/paperglow.css typora/paperglow-dark.css dist/typora/
          (
            cd dist/typora
            zip -q ../typora-paperglow.zip paperglow.css paperglow-dark.css
          )

          cp theme.css manifest.json dist/obsidian/
          (
            cd dist/obsidian
            zip -q ../obsidian-paperglow.zip theme.css manifest.json
          )

          (
            cd vscode
            npm ci
            npm version "${version}" --no-git-tag-version --allow-same-version
            npm run package:vsix
            mv paperglow-theme.vsix ../dist/paperglow-vscode.vsix
          )

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail

          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md found." >&2
            exit 1
          fi

          notes=$(awk -v v="${VERSION}" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if (index($0, "[" v "]") > 0) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md)

          if [ -z "${notes// /}" ]; then
            echo "No CHANGELOG.md section found for version ${VERSION}." >&2
            exit 1
          fi

          {
            echo "body<<EOF"
            echo "${notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Paperglow ${{ steps.build.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/typora-paperglow.zip
            dist/obsidian-paperglow.zip
            dist/obsidian/manifest.json
            dist/obsidian/theme.css
            dist/paperglow-vscode.vsix
